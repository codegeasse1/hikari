[versions]
# Android Gradle Plugin. 8.10 is the OLDEST AGP that supports compileSdk 36,
# and something in the extension ecosystem now requires that: OkHttp 5.4.0's
# Android artifact (`okhttp-android`, pulled in automatically by
# `com.squareup.okhttp3:okhttp`) declares `minCompileSdk = 36` in its AAR
# metadata, and AGP refuses to build a project that compiles against less —
# "Dependency ... requires libraries and applications that depend on it to
# compile against version 36 or later". 8.10.1 is the newest 8.10 patch, and
# 8.10 is the newest AGP that still runs on this project's Gradle 8.11.1 (AGP
# 8.11 needs Gradle 8.13), so the wrapper does not have to move too.
agp = "8.10.1"
kotlin = "2.4.0"
coreKtx = "1.13.1"
lifecycle = "2.8.4"
activityCompose = "1.9.0"
composeBom = "2025.01.01"
navigationCompose = "2.7.7"
datastore = "1.1.1"
media3 = "1.7.1"
# OkHttp 5, NOT 4. This is not a preference — extensions built on the current
# extension-lib (1.6.x / the keiyoushi multisrc families) link against classes
# that only exist in OkHttp 5: `okhttp3.CompressionInterceptor`, `okhttp3.Gzip`,
# `okhttp3.brotli.Brotli`/`BrotliInterceptor` and `okhttp3.zstd.Zstd`, plus
# `com.squareup.zstd.okio.zstdCompress`. `KeiSource.client` (the lazy client
# every multisrc source builds out of the one we hand it) references all of them
# from its own method bodies, so on OkHttp 4 those extensions died with a
# NoClassDefFoundError on the first request — an empty catalog with nothing on
# screen to explain it. Aniyomi's own app — the one these extensions are built
# against — ships 5.4.0 with brotli+zstd, and so does Nekoread. See the notes
# beside the imports in app/build.gradle.kts.
okhttp = "5.4.0"
# jsoup is the other library extensions are compiled against and do NOT bundle;
# they link our copy, so it has to be at least as new as the one extension-lib
# 1.6 was compiled with (1.22.2 — same as Aniyomi's app). Older copies are how
# a source that compiles fine against its own jsoup dies here on
# NoSuchMethodError.
jsoup = "1.22.2"
# Transitive dependency of okhttp-zstd; Android artifacts, published by Square.
zstdKmpOkio = "0.4.0"
coil = "2.6.0"
splashscreen = "1.0.1"
serializationJson = "1.11.0"
jackson = "2.17.2"
conscrypt = "2.5.2"
nicehttp = "0.4.18"
preferenceKtx = "1.2.1"
rhino = "1.8.1"
ktor = "3.5.0"
coroutines = "1.11.0"
ksoup = "0.2.6"
datetime = "0.8.0"
atomicfu = "0.33.0"
newpipeextractor = "v0.26.3"
cryptography = "0.6.0"
viewbinding = "8.7.3"
cardview = "1.0.0"
zxing = "3.5.3"
camerax = "1.4.2"
# Fingerprint/face unlock for the in-app lock (Settings → Privacy & Browsing →
# App lock). The androidx prompt rather than the platform's own: it works from
# API 24 (the platform BiometricPrompt only exists from API 28), and it tells
# "no sensor" apart from "sensor but nothing enrolled" — which is the difference
# between hiding the fingerprint button and showing it.
biometric = "1.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Supplied because extensions LINK against them (they are not bundled into the
# extension APKs): extension-lib's `KeiSource` adds
# `CompressionInterceptor(Brotli, Gzip, Zstd)` to the client it builds, and
# `KeiSource` also imports `okhttp3.brotli.Brotli`/`okhttp3.zstd.Zstd` and
# `com.squareup.zstd.okio.zstdCompress` for its on-disk filter cache. Without
# these three on the classpath the extension class fails to link the moment the
# source is used. Same set Aniyomi's app ships.
okhttp-brotli = { group = "com.squareup.okhttp3", name = "okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { group = "com.squareup.okhttp3", name = "okhttp-zstd", version.ref = "okhttp" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
zstd-kmp-okio = { group = "com.squareup.zstd", name = "zstd-kmp-okio", version.ref = "zstdKmpOkio" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
# The two kotlinx.serialization modules the Aniyomi extension ecosystem links
# against by name but Hikari's own code never used — see the note beside them in
# app/build.gradle.kts.
kotlinx-serialization-json-okio = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json-okio", version.ref = "serializationJson" }
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "serializationJson" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version.ref = "jackson" }
conscrypt-android = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }
nicehttp = { group = "com.github.Blatzar", name = "NiceHttp", version.ref = "nicehttp" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preferenceKtx" }
rhino = { group = "org.mozilla", name = "rhino", version.ref = "rhino" }
ktor-http = { group = "io.ktor", name = "ktor-http", version.ref = "ktor" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
ksoup = { group = "com.fleeksoft.ksoup", name = "ksoup", version.ref = "ksoup" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "atomicfu" }
newpipeextractor = { group = "com.github.teamnewpipe", name = "NewPipeExtractor", version.ref = "newpipeextractor" }
cryptography-core = { group = "dev.whyoleg.cryptography", name = "cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { group = "dev.whyoleg.cryptography", name = "cryptography-provider-optimal", version.ref = "cryptography" }
# (yt-dlp-android / Chaquopy was removed in 0.9.1 — see the CHANGELOG.)
androidx-viewbinding = { group = "androidx.databinding", name = "viewbinding", version.ref = "viewbinding" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardview" }
# Device pairing (Settings → Backup & Restore → Pair & sync): zxing for the QR
# code itself, CameraX for the scanner that reads the other device's.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
# The in-app lock's fingerprint prompt, and the app-level foreground/background
# signal it locks again on (ProcessLifecycleOwner — see AppLockGate).
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
