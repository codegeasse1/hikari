name: F-Droid Repo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fdroidserver
        run: pip install --quiet fdroidserver

      - name: Restore signing keystore
        id: cache
        uses: actions/cache@v4
        with:
          path: fdroid/signing
          key: fdroid-keystore-v1

      - name: Generate signing keystore (first run only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fdroid/signing
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          echo "$PASS" > fdroid/signing/keystore.pass
          openssl req -x509 -newkey rsa:3072 -keyout /tmp/key.pem -out /tmp/cert.pem \
            -days 3650 -nodes -subj "/CN=Hikari F-Droid Repo" 2>/dev/null
          openssl pkcs12 -export -out fdroid/signing/keystore.p12 \
            -inkey /tmp/key.pem -in /tmp/cert.pem -passout pass:"$PASS" 2>/dev/null

      - name: Download latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fdroid/repo
          rm -f fdroid/repo/*.apk
          TAG=$(gh release view --json tagName -q .tagName)
          gh release download "$TAG" --pattern 'hikari.apk' --dir fdroid/repo

      - name: Configure repo
        run: |
          PASS=$(cat fdroid/signing/keystore.pass)
          cat > fdroid/config.yml <<EOF
          repo_url: "https://codegeasse1.github.io/hikari/fdroid/repo"
          repo_name: "Hikari"
          repo_description: "Hikari - a universal streaming app: Stremio addons, universal scrapers, CloudStream .cs3 plugins and more. Modern Material 3 UI."
          repo_icon: ""
          keystore: "signing/keystore.p12"
          keystorepass: "$PASS"
          keyalias: "hikari"
          keypass: "$PASS"
          archive_older: 0
          EOF

      - name: Generate F-Droid index
        run: |
          cd fdroid
          fdroid update --create-metadata --pretty --use-date-from-apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid/repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
