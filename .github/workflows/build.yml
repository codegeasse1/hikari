# =============================================================================
#  DO NOT CREATE A MAIN RELEASE WITHOUT THE OWNER ASKING FOR IT, IN WRITING.
#
#  Pushing to `main` publishes the test APKs to the `continuous` pre-release and
#  to the `build` branch. That is the only thing a normal push may do.
#
#  A *main* release (a non-prerelease `v<version>` on the releases page) makes
#  that build the version every user is offered, so it is opt-in by hand only,
#  and it is gated twice: the `release` checkbox AND the `confirm_release`
#  input, which must be typed as exactly  CONFIRM-RELEASE . If either is
#  missing the release step does not run; a warning step says so in the log.
#
#  Automation / coding agents: NEVER dispatch this workflow with
#  release=true. Only a human owner, who has explicitly asked for a release
#  in the current conversation, may do that.
# =============================================================================
name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release:
        description: "Create a main release (v<version>) from current main"
        type: boolean
        default: false
      confirm_release:
        description: "Safety gate: type CONFIRM-RELEASE (exactly) to actually publish a main release"
        type: string
        default: ""
      version:
        description: "Release version (e.g. 0.1.0)"
        type: string
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A build that stalls (a Maven download that never lands) used to sit on
    # the runner for half an hour with no output. The per-attempt timeout in
    # the build step handles the common case; this is the backstop.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ---- Android SDK licenses ----
      # This step used to run `sdkmanager --licenses` and then `sdkmanager "platforms;..."`
      # with no time limit. When dl.google.com stalled, sdkmanager sat there for 15+ minutes
      # (the normal time is ~10 seconds) and held the whole build. Now:
      #   1. the licenses are accepted by writing the license files directly (no network,
      #      no sdkmanager, takes a fraction of a second),
      #   2. the platforms / build-tools are only installed if the runner image does not
      #      already have them (the GitHub image normally does),
      #   3. every sdkmanager call has a hard time limit, and the whole step is capped at
      #      5 minutes and can never fail the build (Gradle can fetch what it needs itself).
      - name: Accept Android SDK licenses
        timeout-minutes: 5
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "No Android SDK directory on this runner; Gradle will handle it."
            exit 0
          fi
          LIC="$SDK/licenses"
          sudo mkdir -p "$LIC"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' | sudo tee "$LIC/android-sdk-license" > /dev/null
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' | sudo tee "$LIC/android-sdk-preview-license" > /dev/null
          echo "Licenses written to $LIC"

          MISSING=()
          for P in android-34 android-35 android-36; do
            [ -d "$SDK/platforms/$P" ] || MISSING+=("platforms;$P")
          done
          for B in 34.0.0 35.0.0; do
            [ -d "$SDK/build-tools/$B" ] || MISSING+=("build-tools;$B")
          done
          echo "Installed platforms:   $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "Installed build-tools: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"

          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "All needed SDK parts are already installed - nothing to download."
          else
            echo "Installing missing: ${MISSING[*]}"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SDKM" ]; then
              yes | timeout 240 "$SDKM" "${MISSING[@]}" > /tmp/sdkmanager.log 2>&1 || echo "sdkmanager did not finish (exit $?); Gradle will fetch what it needs."
              tail -n 5 /tmp/sdkmanager.log || true
            else
              echo "sdkmanager not found; Gradle will fetch what it needs."
            fi
          fi

      - name: Prepare signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/hikari-keystore.p12"
            echo "SIGNING_STORE_PATH=$RUNNER_TEMP/hikari-keystore.p12" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        id: setup-gradle
        continue-on-error: true
        with:
          gradle-version: "8.11.1"
          # The GitHub cache service occasionally has outages that make the
          # restore/save steps exit 1 and kill the whole build before gradle
          # even runs. Disabling the cache costs a couple of minutes of
          # dependency re-downloads but makes builds deterministic.
          cache-disabled: true

      - name: Gradle fallback (when setup-gradle is flaky)
        if: always()
        run: |
          if gradle --version 2>/dev/null | head -n 5; then
            echo "gradle already available"
          else
            echo "setup-gradle did not provide gradle, installing manually..."
            for i in 1 2 3; do
              curl -L --fail --retry 3 --connect-timeout 30 --max-time 600 -o /tmp/gradle.zip \
                https://services.gradle.org/distributions/gradle-8.11.1-bin.zip && break
              echo "gradle download attempt $i failed, retrying in 15s..."
              sleep 15
            done
            if [ -f /tmp/gradle.zip ]; then
              unzip -q /tmp/gradle.zip -d /tmp || true
              export PATH="/tmp/gradle-8.11.1/bin:$PATH"
              echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"
              gradle --version | head -n 5 || true
            fi
          fi
          echo "==== network diagnostics ===="
          for u in https://services.gradle.org/distributions/ https://github.com https://api.github.com https://dl.google.com; do
            echo -n "$u -> "
            curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$u" || echo "FAIL"
            echo ""
          done || true

      - name: Fetch sherpa-onnx AAR (AI Dub TTS engine)
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/sherpa-onnx.aar ] || [ ! -s app/libs/sherpa-onnx.aar ]; then
            rm -f app/libs/sherpa-onnx.aar
            for i in 1 2 3 4 5 6 7 8; do
              echo "sherpa AAR download attempt $i/8 (curl)..."
              curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 --max-time 600 -o app/libs/sherpa-onnx.aar \
                https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar && break
              echo "curl attempt $i failed, trying wget..."
              wget -O app/libs/sherpa-onnx.aar \
                https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar && break || true
              echo "sherpa AAR download attempt $i failed, retrying in 30s..."
              sleep 30
            done
          fi
          ls -la app/libs/sherpa-onnx.aar
          SIZE=$(stat -c%s app/libs/sherpa-onnx.aar 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::sherpa-onnx.aar is only $SIZE bytes (expected ~50MB) - download is truncated."
            exit 1
          fi

      # ---- Dub audio check: the sherpa-onnx AAR must carry the classes the Dub code uses ----
      # The neural voice (Pocket TTS / Kokoro / Piper) is called directly by the Dub code, so a
      # sherpa-onnx build that lacks them would fail Gradle after minutes with a long pile of
      # errors. This fails in a second and says what is missing. The speaker scan and the
      # subtitle-from-voice classes are reached by name, so for those it is only a warning.
      - name: Check the sherpa-onnx AAR has the Dub classes
        run: |
          set -e
          unzip -p app/libs/sherpa-onnx.aar classes.jar > /tmp/sherpa-classes.jar
          LIST=$(unzip -l /tmp/sherpa-classes.jar)
          bad=0
          for C in OfflineTts OfflineTtsConfig OfflineTtsModelConfig OfflineTtsVitsModelConfig \
                   OfflineTtsKokoroModelConfig OfflineTtsPocketModelConfig GenerationConfig; do
            if ! echo "$LIST" | grep -q "com/k2fsa/sherpa/onnx/$C.class"; then
              echo "::error::sherpa-onnx AAR has no class '$C' - Dub audio needs sherpa-onnx 1.12.24 or newer (this build uses 1.13.8)."
              bad=1
            fi
          done
          for C in SpeakerEmbeddingExtractor SpeakerEmbeddingExtractorConfig OfflineRecognizer OfflineStream Vad; do
            if ! echo "$LIST" | grep -q "com/k2fsa/sherpa/onnx/$C.class"; then
              echo "::warning::sherpa-onnx AAR has no class '$C' - the voice scan / subtitle-from-voice will not work."
            fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "sherpa-onnx AAR has the Dub classes."

      - name: Build APKs (debug + release)
        env:
          GIT_SHA: ${{ github.sha }}
          SIGNING_STORE_PATH: ${{ env.SIGNING_STORE_PATH }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Maven Central / JitPack occasionally rate-limit (HTTP 429) or stall cold
          # dependency downloads. The whole build is retried a few times.
          #
          # A stalled build used to be noticed only when the 25-minute per-attempt timeout
          # fired - twice in a row that is 50 of the job's 60 minutes gone for nothing.
          # Also, `timeout` stopped only the `gradle` launcher and could leave the Gradle
          # JVM (and the Kotlin compile daemon) running in the background, still holding
          # the dependency locks, so the next attempt stalled behind it.
          # Now:
          #   - Gradle runs in its own process group, so one kill stops all of it,
          #   - a watchdog stops an attempt whose log has not grown for STALL seconds
          #     (a real compile never goes silent that long), or that passes MAX seconds,
          #   - leftover Gradle / Kotlin daemons are killed before the next attempt.
          # `set +e` is load-bearing: this step's shell runs with `-e`, and a failing
          # command would abort the script before the retry and before the error dump below.
          set +e
          MAX=1500
          STALL=720

          kill_gradle() {
            [ -n "$GPID" ] && kill -TERM -- "-$GPID" 2>/dev/null
            sleep 3
            [ -n "$GPID" ] && kill -KILL -- "-$GPID" 2>/dev/null
            pkill -9 -f 'org.gradle.launcher.daemon.bootstrap.GradleDaemon' 2>/dev/null
            pkill -9 -f 'org.jetbrains.kotlin.daemon.KotlinCompileDaemon' 2>/dev/null
            pkill -9 -f 'gradle-launcher' 2>/dev/null
            return 0
          }

          run_gradle() {
            : > gradle-build.log
            setsid gradle assembleDebug assembleRelease --no-daemon --stacktrace --console=plain \
              -Dorg.gradle.internal.http.connectionTimeout=30000 \
              -Dorg.gradle.internal.http.socketTimeout=60000 \
              -Dorg.gradle.internal.repository.max.tentatives=5 \
              > gradle-build.log 2>&1 &
            GPID=$!
            START=$(date +%s)
            LAST_SIZE=0
            LAST_CHANGE=$START
            while kill -0 "$GPID" 2>/dev/null; do
              sleep 10
              NOW=$(date +%s)
              SIZE=$(stat -c%s gradle-build.log 2>/dev/null || echo 0)
              if [ "$SIZE" != "$LAST_SIZE" ]; then
                LAST_SIZE=$SIZE
                LAST_CHANGE=$NOW
              fi
              if [ $((NOW - START)) -gt $MAX ]; then
                echo "==== attempt ran longer than ${MAX}s - stopping it ===="
                kill_gradle
                return 124
              fi
              if [ $((NOW - LAST_CHANGE)) -gt $STALL ]; then
                echo "==== no Gradle output for ${STALL}s (stalled download?) - stopping it ===="
                kill_gradle
                return 124
              fi
            done
            wait "$GPID"
            return $?
          }

          code=1
          for attempt in 1 2 3 4 5; do
            echo "==== Gradle build attempt $attempt/5 ===="
            run_gradle
            code=$?
            if [ $code -eq 0 ]; then
              break
            fi
            kill_gradle
            if [ $code -eq 124 ] || grep -qE "429|Too Many Requests|Connection reset|Read timed out|SocketTimeout|connect timed out|Could not resolve|Unable to load Maven meta-data|Could not GET|Could not HEAD" gradle-build.log; then
              echo "==== Attempt $attempt hit a rate-limit or network stall (exit $code); retrying in 30s ===="
              sleep 30
            else
              echo "==== Attempt $attempt failed with a non-network error; stopping ===="
              break
            fi
          done
          if [ $code -ne 0 ]; then
            echo "==== BUILD FAILED (exit $code) ===="
            tail -n 200 gradle-build.log
            echo "==== KOTLIN ERRORS ===="
            grep -E "^e: " gradle-build.log | head -n 40
            grep -E "^e: " gradle-build.log | head -n 40 | sed -E 's/^e: (.+): \(([0-9]+), ([0-9]+)\): (.*)/::error file=\1,line=\2,col=\3::\4/' || true
          fi
          exit $code

      # ---- Split APKs: work out which files this build produced ----
      # The release build now emits one APK per phone processor
      # (`-armeabi-v7a-` = 32-bit arm, `-arm64-v8a-` = 64-bit arm) plus a
      # universal one carrying both, so the file names depend on the split
      # filter. This step resolves them once (into $GITHUB_ENV, so every step
      # below can use them) and dumps the build's own output-metadata.json into
      # the log, which is where the version code of each APK is recorded.
      - name: Collect release APKs
        run: |
          OUT=app/build/outputs/apk/release
          echo "==== release output files ===="
          ls -la "$OUT"
          echo "==== release output-metadata.json ===="
          cat "$OUT/output-metadata.json" 2>/dev/null || echo "(no output-metadata.json)"
          echo "==== debug output files ===="
          ls -la app/build/outputs/apk/debug 2>/dev/null || true
          APK_ARM64=$(ls "$OUT" 2>/dev/null | grep -E 'arm64-v8a.*\.apk$' | head -n1 || true)
          APK_ARM32=$(ls "$OUT" 2>/dev/null | grep -E 'armeabi-v7a.*\.apk$' | head -n1 || true)
          APK_UNIVERSAL=$(ls "$OUT" 2>/dev/null | grep -E 'universal.*\.apk$' | head -n1 || true)
          # Some AGP versions name the universal APK plainly app-release.apk;
          # accept that too so this step can never be what breaks a release.
          if [ -z "$APK_UNIVERSAL" ] && [ -f "$OUT/app-release.apk" ]; then
            APK_UNIVERSAL=app-release.apk
          fi
          {
            echo "APK_ARM64=$APK_ARM64"
            echo "APK_ARM32=$APK_ARM32"
            echo "APK_UNIVERSAL=$APK_UNIVERSAL"
          } >> "$GITHUB_ENV"
          echo "armv8=[$APK_ARM64] armv7=[$APK_ARM32] universal=[$APK_UNIVERSAL]"

      - name: Verify release APKs are signed
        run: |
          if [ -z "$APK_UNIVERSAL" ]; then
            echo "::error::Release APK is missing - signing was not configured. Check the SIGNING_KEY / ALIAS / KEY_STORE_PASSWORD / KEY_PASSWORD secrets, and that the ABI splits still produce a universal APK."
            exit 1
          fi
          # One APK per processor type plus the universal one, each plausibly
          # sized (a split whose signing was skipped would come out near-empty).
          for f in "$APK_ARM64" "$APK_ARM32" "$APK_UNIVERSAL"; do
            if [ -z "$f" ]; then
              echo "::error::A release APK is missing - expected one per ABI plus a universal APK."
              exit 1
            fi
            size=$(stat -c%s "app/build/outputs/apk/release/$f")
            echo "$f = $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is only $size bytes - signing was probably not configured."
              exit 1
            fi
          done
          ls -la app/build/outputs/apk/release/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hikari-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ---- TEST CHANNELS: updated on every push to main ----
      # The build branch gets all three APKs (universal, arm64-v8a, armeabi-v7a), each one
      # on its own. GitHub refuses any single file over 100 MiB, and the universal APK
      # (both processors in one file) can pass that, which used to make this step skip the
      # WHOLE push, so even the small arm64 / arm32 APKs never reached the branch. Now each
      # file is checked on its own: the ones under the limit are pushed, one that is too big
      # is skipped with a warning (it is still on the `continuous` release, which has no
      # such limit, and in the run's artifacts).
      # The branch is built in a fresh empty folder so it only ever contains the APKs
      # (the old way committed from the checked-out source tree).
      - name: Publish test APKs to build branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$PWD/app/build/outputs/apk/release"
          LIMIT=104000000   # just under GitHub's 100 MiB (104,857,600 B) per-file limit
          STAGE="$RUNNER_TEMP/build-branch"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          COUNT=0
          for spec in \
            "$APK_UNIVERSAL=hikari.apk" \
            "$APK_ARM64=hikari-arm64-v8a.apk" \
            "$APK_ARM32=hikari-armeabi-v7a.apk"
          do
            SRC="${spec%%=*}"
            DST="${spec#*=}"
            if [ -z "$SRC" ] || [ ! -f "$OUT/$SRC" ]; then
              echo "::warning::$DST: no source APK found, skipped."
              continue
            fi
            SIZE=$(stat -c%s "$OUT/$SRC")
            if [ "$SIZE" -ge "$LIMIT" ]; then
              echo "::warning::$DST is $((SIZE / 1048576)) MB - over GitHub's 100 MB file limit, not put on the build branch. Download it from the 'continuous' release instead."
              continue
            fi
            cp "$OUT/$SRC" "$STAGE/$DST"
            echo "build branch: $DST ($((SIZE / 1048576)) MB)"
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing small enough for the build branch; the APKs are on the continuous release and in the artifacts."
            exit 0
          fi
          cd "$STAGE"
          git init -q
          git checkout -q --orphan build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: update test APKs $(date -u +%Y%m%d%H%M)"
          for i in 1 2 3; do
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build && break
            echo "build-branch push attempt $i failed, retrying in 10s..."
            sleep 10
          done || true

      - name: Publish test APK to continuous release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "app/build/outputs/apk/release/$APK_UNIVERSAL" hikari-signed.apk
          cp "app/build/outputs/apk/release/$APK_ARM64" hikari-arm64-v8a.apk
          cp "app/build/outputs/apk/release/$APK_ARM32" hikari-armeabi-v7a.apk
          if gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for i in 1 2 3; do
              gh release upload continuous hikari-signed.apk hikari-arm64-v8a.apk hikari-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" --clobber && break
              echo "continuous upload attempt $i failed (often a transient race with a concurrent build), retrying..."
              sleep 5
            done
          else
            gh release create continuous hikari-signed.apk hikari-arm64-v8a.apk hikari-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" \
              --title "Continuous build" \
              --notes "Signed test APKs, auto-built from main. hikari-signed.apk is the universal build; the arm64-v8a / armeabi-v7a ones are smaller and for that processor type only." || true
          fi

      # ---- MAIN RELEASE: manual only, and only with the typed confirmation ----
      # A main release is the build every user gets offered, so it never happens
      # as a side effect of a push, and an accidental dispatch cannot trigger it:
      # both the `release` checkbox and the typed `confirm_release` gate must be
      # present. See the header of this file.
      - name: Refuse unconfirmed main release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.event.inputs.confirm_release != 'CONFIRM-RELEASE'
        run: |
          echo "::warning title=Main release refused::A main release was requested but NOT published: the 'confirm_release' input must be set to exactly CONFIRM-RELEASE. Nothing was released - the continuous pre-release is unaffected."

      - name: Publish main release (manual only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.event.inputs.confirm_release == 'CONFIRM-RELEASE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION:-0.1.0}"
          cp "app/build/outputs/apk/release/$APK_UNIVERSAL" hikari.apk
          # Each release carries all three builds: the universal APK under the
          # name every existing link and the in-app updater already use, plus
          # the two processor-specific ones so a user can download the smaller
          # file that matches their phone.
          cp "app/build/outputs/apk/release/$APK_ARM64" hikari-arm64-v8a.apk
          cp "app/build/outputs/apk/release/$APK_ARM32" hikari-armeabi-v7a.apk
          # The release body is that version's own CHANGELOG.md section, so the
          # releases page and the changelog can never drift apart.
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v v="$VERSION" '$0 == "## " v {p=1; next} /^## / {p=0} p' CHANGELOG.md | sed -e 's/[[:space:]]*$//' | cat -s)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Signed release APK."
            echo "No CHANGELOG.md section found for $VERSION; using the default notes."
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for i in 1 2 3; do
              gh release upload "$TAG" hikari.apk hikari-arm64-v8a.apk hikari-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" --clobber && break
              echo "release upload attempt $i failed (often a transient race with a concurrent build), retrying..."
              sleep 5
            done
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Hikari $VERSION" --notes "$NOTES" || true
          else
            gh release create "$TAG" hikari.apk hikari-arm64-v8a.apk hikari-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" \
              --title "Hikari $VERSION" \
              --notes "$NOTES" || true
          fi
          # Give each file a readable name on the releases page. GitHub shows an
          # asset's `label` INSTEAD of its file name, so "hikari.apk" reads as
          # "Hikari Android & TV Universal" while the download URL keeps the
          # file name the in-app updater and every existing link already use.
          REL_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            for spec in \
              "hikari.apk=Hikari Android & TV Universal" \
              "hikari-arm64-v8a.apk=Hikari Android & TV 64-bit (arm64-v8a)" \
              "hikari-armeabi-v7a.apk=Hikari Android & TV 32-bit (armeabi-v7a)"
            do
              FILE="${spec%%=*}"
              LABEL="${spec#*=}"
              ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets" \
                --jq ".[] | select(.name==\"$FILE\") | .id" 2>/dev/null | head -n1 || true)
              if [ -n "$ASSET_ID" ]; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
                  -f label="$LABEL" --jq '"asset label: " + .name + " -> " + .label' || true
              fi
            done
          fi
