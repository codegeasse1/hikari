name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hikari-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hikari-debug.apk
          if gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload continuous hikari-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create continuous hikari-debug.apk --repo "$GITHUB_REPOSITORY" \
              --title "Continuous build" \
              --notes "Latest debug APK, auto-built from main." || true
          fi

      - name: Push debug APK to build branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin build >/dev/null 2>&1 && git checkout build 2>/dev/null || git checkout --orphan build
          cp app/build/outputs/apk/debug/app-debug.apk hikari-debug.apk
          git add hikari-debug.apk
          git commit -m "build: update debug APK $(date -u +%Y%m%d%H%M)" || true
          git push origin build --force
