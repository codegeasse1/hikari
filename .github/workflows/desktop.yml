name: Windows desktop

on:
  push:
    branches: [ main, desktop/windows11-mvp ]
    paths:
      - 'desktop/**'
      - 'settings.gradle.kts'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'settings.gradle.kts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Run desktop tests and build Windows installers
        run: |
          gradle :desktop:test :desktop:packageMsi :desktop:packageExe --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hikari-windows-${{ github.sha }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 30
